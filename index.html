  <!--
    Applies the stored theme before first paint. Without this a returning
    dark-mode visitor sees a frame of light before it snaps over, which reads
    as a flash. Light is the default; dark is opt-in via the toggle.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
